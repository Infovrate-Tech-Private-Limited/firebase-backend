name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Lint, Format, Build, Pack (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Husky runs on "prepare" in your repo. In CI we don't need hooks.
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Format check (Prettier)
        run: npm run format

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (tsup -> dist)
        run: npm run build
        env:
          NODE_ENV: production

      # Verifies exactly what would be published to npm (files list + size).
      - name: Pack dry run (publish contents check)
        run: npm pack --dry-run

      # Optional: upload dist for inspection/download
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-node-${{ matrix.node }}
          path: dist
          if-no-files-found: error
